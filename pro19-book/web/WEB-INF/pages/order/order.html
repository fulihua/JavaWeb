<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <!-- 修复1：spann 改为 span -->
  <span th:replace="common/head::head"></span>
  <link rel="stylesheet" th:href="@{/static/css/cart.css}" />
  <link rel="stylesheet" th:href="@{/static/css/bookManger.css}" />
  <link rel="stylesheet" th:href="@{/static/css/orderManger.css}" />
</head>
<body>
<div class="header">
  <div class="w">
    <div class="header-left">
      <a th:href="@{/index.html}">
        <img th:src="@{/static/img/logo.gif}" alt="" />
      </a>
      <h1>我的订单</h1>
    </div>
    <div class="header-right" th:include="common/welcome::welcome">
    </div>
  </div>
</div>
<div class="list">
  <div class="w">
    <table>
      <thead>
      <tr>
        <th>订单号</th>
        <th>订单日期</th>
        <th>订单金额</th>
        <th>订单数量</th>
        <th>订单状态</th>
        <th>订单详情</th>
      </tr>
      </thead>
      <tbody>
      <!-- 修复2：oderBean 改为 orderBean -->
      <tr th:each="orderBean : ${session.currUser.orderBeanList}" th:object="${orderBean}">
        <!-- 注意：这里假设你的实体类有 getOrderNo() 属性 -->
        <td th:text="*{orderNo}">12354456895</td>

        <td th:text="*{#dates.format(orderDate,'yyyy-MM-dd HH:mm:ss')}">2015.04.23</td>

        <!-- 修复3：去掉多余的 orderBean. -->
        <td th:text="*{#numbers.formatDecimal(orderMoney,0,'COMMA',2,'POINT')}">90.00</td>

        <td th:text="*{orderCount}">88</td>

        <td th:switch="*{orderStatus}">
          <a href="" class="send" th:case="0">等待发货</a>
          <a href="" class="send" th:case="1">已发货</a>
          <a href="" class="send" th:case="2">待评价</a>
        </td>
        <td><a href="">查看详情</a></td>
      </tr>
      </tbody>
    </table>
    <!-- 下面分页和底部的代码我顺便帮你把图片路径改成了 th:src -->
    <div class="footer">
      <div class="footer-right">
        <div>首页</div>
        <div>上一页</div>
        <ul>
          <li class="active">1</li>
          <li>2</li>
          <li>3</li>
        </ul>
        <div>下一页</div>
        <div>末页</div>
        <span>共10页</span>
        <span>30条记录</span>
        <span>到第</span>
        <input type="text" />
        <span>页</span>
        <button>确定</button>
      </div>
    </div>
  </div>
</div>
<div class="bottom">
  <div class="w">
    <div class="top">
      <ul>
        <li>
          <a href="">
            <img th:src="@{/static/img/bottom1.png}" alt="" />
            <span>大咖级讲师亲自授课</span>
          </a>
        </li>
        <li>
          <a href="">
            <img th:src="@{/static/img/bottom.png}" alt="" />
            <span>课程为学员成长持续赋能</span>
          </a>
        </li>
        <li>
          <a href="">
            <img th:src="@{/static/img/bottom2.png}" alt="" />
            <span>学员真是情况大公开</span>
          </a>
        </li>
      </ul>
    </div>
    <div class="content">
      <dl>
        <dt>关于尚硅谷</dt>
        <dd>教育理念</dd>
      </dl>
      <dl>
        <dt>资源下载</dt>
        <dd>视频下载</dd>
      </dl>
      <dl>
        <dt>加入我们</dt>
        <dd>招聘岗位</dd>
      </dl>
      <dl>
        <dt>联系我们</dt>
        <dd>http://www.atguigu.com</dd>
        <dd></dd>
      </dl>
    </div>
  </div>
  <div class="down">
    尚硅谷书城.Copyright ©2015
  </div>
</div>
</body>
</html>
