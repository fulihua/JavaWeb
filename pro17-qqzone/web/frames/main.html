<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <script th:src="@{/js/main.js}"></script>
</head>
<body>
    <div id="div_topic_list">
        <div id="div_to_add">
            <p class="right8"><a th:href="@{/page(page='frames/add')}">发表新日志</a></p>
        </div>
        <table id="tbl_topic_list">
            <tr>
                <th>ID</th>
                <th>标题</th>
                <th>日期</th>
                <th>操作</th>
            </tr>
            <tr th:if="${not #lists.isEmpty(session.friend.topicList)}"  th:each="topic,status : ${session.friend.topicList}">
                <td th:text="${status.count}">1</td>
                <td class="left"><a th:href="@{/topic.do(oper='detail',id=${topic.id})}" th:text="${topic.title}">萧某今天就和天下群雄决一死战，你们一起上吧！</a></td>
                <td th:text="${topic.topicDate}">2021-09-01 12:30:55 </td>
                <td><a th:href="|javascript:delTopic(${topic.id})|" th:if="${session.userBasic.id==session.friend.id}" >删除</a></td>
            </tr>
                <tr th:unless="${not #lists.isEmpty(session.friend.topicList)}">
                    <th colspan="4">暂无日志</th>
            </tr>
        </table>
    </div>
</body>
</html>
